    entity_id: climate.thermostat
    attribute: hvac_action
    to: heating
  - id: cooling_starts
    trigger: state
    entity_id: climate.thermostat
    attribute: hvac_action
    to: cooling
  - id: sensor_unavailable
    trigger: state
    entity_id: sensor.govee_thermometer_nursery_h5104_temperature
    to: unavailable
  - id: hatch_playing
    device_id: 54376091c5980b4a3ea7b981389db0df
    domain: media_player
    entity_id: b08609d1c4a650ea08bb26c14de1564b
    type: playing
    trigger: device
    enabled: false
  - id: periodic
    trigger: time_pattern
    minutes: /5
  - id: ha_start
    trigger: homeassistant
    event: start
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id:
      - morning_off
      - sensor_unavailable
    - condition: and
      conditions:
      - condition: time
        after: '19:00:00'
        before: 07:00:00
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.guest_mode
          state: 'on'
        - condition: state
          entity_id: person.andrew
          state: home
        - condition: state
          entity_id: person.amy
          state: home
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - morning_off
        - sensor_unavailable
      sequence:
      - target:
          entity_id: switch.tapo_p110m_2_nursery_heater
        action: switch.turn_off
        data: {}
    - conditions:
      - condition: trigger
        id: cooling_starts
      sequence:
      - target:
          entity_id: switch.tapo_p110m_2_nursery_heater
        action: switch.turn_on
        data: {}
    - conditions:
      - condition: state
        entity_id: climate.thermostat
        attribute: hvac_action
        state: heating
      - condition: device
        device_id: 54376091c5980b4a3ea7b981389db0df
        domain: media_player
        entity_id: b08609d1c4a650ea08bb26c14de1564b
        type: is_playing
        enabled: false
      sequence:
      - target:
          entity_id: switch.tapo_p110m_2_nursery_heater
        action: switch.turn_off
        data: {}
    - conditions:
      - condition: numeric_state
        entity_id: sensor.govee_thermometer_nursery_h5104_temperature
        above: 72
      - condition: device
        device_id: 54376091c5980b4a3ea7b981389db0df
        domain: media_player
        entity_id: b08609d1c4a650ea08bb26c14de1564b
        type: is_playing
        enabled: false
      sequence:
      - target:
          entity_id: switch.tapo_p110m_2_nursery_heater
        action: switch.turn_off
        data: {}
    - conditions:
      - condition: numeric_state
        entity_id: sensor.govee_thermometer_nursery_h5104_temperature
        below: 69
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.thermostat
          attribute: hvac_action
          state: heating
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.govee_thermometer_nursery_h5104_temperature
          state: unavailable
      - condition: device
        device_id: 54376091c5980b4a3ea7b981389db0df
        domain: media_player
        entity_id: b08609d1c4a650ea08bb26c14de1564b
        type: is_playing
        enabled: false
      sequence:
      - target:
          entity_id: switch.tapo_p110m_2_nursery_heater
        action: switch.turn_on
        data: {}
    default:
