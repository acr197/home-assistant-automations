        milliseconds: 0
    - choose:
      - conditions:
        - condition: state
          entity_id: light.hue_candle_lower_staircase
          state: 'off'
        sequence:
        - target:
            entity_id: light.hue_candle_lower_staircase
          data:
            brightness_pct: 1
            color_temp_kelvin: 2222
            transition: 1
          action: light.turn_on
        - delay:
            seconds: 11
        - target:
            entity_id:
            - light.hue_candle_lower_staircase
            - light.hue_candle_upper_staircase
          data:
            brightness_pct: 1
            color_temp_kelvin: 2222
            transition: 0
          action: light.turn_on
        - delay:
            seconds: 94
        - target:
            entity_id:
            - light.hue_candle_lower_staircase
            - light.hue_candle_upper_staircase
          action: light.turn_off
      default:
      - delay:
          seconds: 11
      - target:
          entity_id: light.hue_candle_upper_staircase
        data:
          brightness_pct: 1
          color_temp_kelvin: 2222
          transition: 0
        action: light.turn_on
      - delay:
          seconds: 94
      - target:
          entity_id: light.hue_candle_upper_staircase
        action: light.turn_off
  mode: single
- id: '1762737154334'
  alias: 'Staircase: Follow Middle + Smart Nightlight'
  description: 'Upper stair follows middle hallway; lower is a nightlight at 1% only
    when the middle is off. If middle is on at ≥30% both stair lights go 100%; if
    middle is on between 1–29% both go 30%.

    '
  triggers:
  - trigger: state
    entity_id: light.staircase_hue_lights_hue_white_lamp_middle_staircase
  - trigger: state
    entity_id: light.hue_candle_upper_staircase
    to: 'off'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: light.staircase_hue_lights_hue_white_lamp_middle_staircase
        state: 'on'
      - condition: template
        value_template: '{{ (state_attr(''light.staircase_hue_lights_hue_white_lamp_middle_staircase'',''brightness'')|int(0))
          >= 77 }}

          '
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.hue_candle_lower_staircase
          - light.hue_candle_upper_staircase
        data:
          color_temp_kelvin: 2222
          transition: 1
          brightness_pct: 3
    - conditions:
      - condition: state
        entity_id: light.staircase_hue_lights_hue_white_lamp_middle_staircase
        state: 'on'
      - condition: template
        value_template: '{% set b = state_attr(''light.staircase_hue_lights_hue_white_lamp_middle_staircase'',''brightness'')|int(0)
          %} {{ b > 0 and b < 77 }}

          '
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.hue_candle_lower_staircase
          - light.hue_candle_upper_staircase
        data:
          brightness_pct: 3
          color_temp_kelvin: 2222
          transition: 1
    - conditions:
      - condition: state
        entity_id: light.staircase_hue_lights_hue_white_lamp_middle_staircase
        state: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.hue_candle_upper_staircase
        data:
          transition: 1
      - action: light.turn_on
        target:
          entity_id: light.hue_candle_lower_staircase
        data:
          brightness_pct: 1
          color_temp_kelvin: 2222
          transition: 1
    default:
    - choose:
      - conditions:
        - condition: state
          entity_id: light.staircase_hue_lights_hue_white_lamp_middle_staircase
          state: 'off'
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.hue_candle_lower_staircase
          data:
            brightness_pct: 1
            color_temp_kelvin: 2222
            transition: 1
  mode: restart
- id: '1764032637877'
  alias: 'Living Room: Dim Lights to 80% After Sunset'
  description: Slowly dim Main Level lights to 65% over 1 hour after sunset if they
    were brighter.
  triggers:
  - trigger: sun
    event: sunset
  conditions:
  - condition: state
    entity_id: light.living_room
    state: 'on'
  - condition: numeric_state
    entity_id: light.living_room
    attribute: brightness
    above: 166
  actions:
  - action: light.turn_on
    target:
      entity_id: light.living_room
    data:
      transition: 3600
      brightness_pct: 80
  mode: single
- id: '1768008079253'
  alias: 'Nursery: Govee battery low or missing (6hr nag)'
  description: Alerts every 6 hours if Govee battery is <5% or state is null/unknown/unavailable.
  triggers:
  - hours: /6
    trigger: time_pattern
  - entity_id: sensor.govee_thermometer_nursery_h5104_battery
    below: 5
    for:
      minutes: 5
    trigger: numeric_state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.govee_thermometer_nursery_h5104_battery
          below: 5
        - condition: state
          entity_id: sensor.govee_thermometer_nursery_h5104_battery
          state: unknown
        - condition: state
          entity_id: sensor.govee_thermometer_nursery_h5104_battery
          state: unavailable
        - condition: template
          value_template: '{% set s = states(''sensor.govee_thermometer_nursery_h5104_battery'')
            | lower %} {{ s in [''none'',''null'',''''] }}

            '
      sequence:
      - action: notify.mobile_app_pixel_10
        data:
          title: Nursery Sensor Alert
          message: 'Govee nursery battery is low or missing (current: {{ states(''sensor.govee_thermometer_nursery_h5104_battery'')
            }}%).

            '
          data:
            ttl: 0
            priority: high
  mode: single
- id: '1771270799103'
  alias: 'GitHub: Push Config to GitHub'
  description: Push Home Assistant config to GitHub when the Push button is pressed.
  triggers:
  - trigger: state
    entity_id: input_button.push_to_github
  conditions: []
  actions:
  - action: shell_command.git_push
  mode: single
- id: '1771270799104'
  alias: 'GitHub: Pull Config from GitHub'
  description: Pull config from GitHub and restart Home Assistant when the Pull button
    is pressed.
  triggers:
  - trigger: state
    entity_id: input_button.pull_from_github
  conditions: []
  actions:
  - action: shell_command.git_pull
    response_variable: pull_result
  - condition: template
    value_template: '{{ pull_result[''returncode''] == 0 and (pull_result.get(''stdout'', '''') | trim)
      == ''changed'' }}'
  - delay:
      seconds: 3
  - action: homeassistant.restart
  mode: single
- id: '1771270799106'
  alias: 'GitHub: Auto Pull and Reboot on Merge to Main'
  description: Pulls latest config from GitHub and reboots Home Assistant whenever
    a commit is merged to the main branch. Triggered by the GitHub Actions webhook.
  triggers:
  - trigger: webhook
    webhook_id: 4a115006f7f0a2bce53cb35881d54f5ca93c337c08da7888ce7d9842b5a1b5eb
    allowed_methods:
    - POST
    local_only: false
  conditions: []
  actions:
  - action: shell_command.git_pull
    response_variable: pull_result
  - condition: template
    value_template: '{{ pull_result[''returncode''] == 0 and (pull_result.get(''stdout'', '''') | trim)
      == ''changed'' }}'
  - delay:
      seconds: 3
  - action: homeassistant.restart
  mode: single
- id: '1771270799107'
  alias: 'GitHub: Nightly Auto Push'
  description: Every day at 3am, push the current config to GitHub so changes made
    directly on the Pi, including by Claude Code, are backed up even if the manual
    Push button is never pressed. No-op when nothing changed.
  triggers:
  - trigger: time
    at: 03:00:00
  conditions: []
  actions:
  - action: shell_command.git_push
    continue_on_error: true
  mode: single
- id: '08000001'
  alias: 'Nursery: Knob toggles night mode (heater + Sonos + hallway light)'
  description: 'Single press of the MOES rotary knob (Tuya TS004F on ZHA) toggles
    nursery night mode, independent of the time-based heater automation. Press when
    the heater automation is disabled: enables it, runs it once so the heater reacts
    to the current temperature, turns off the middle staircase light, and drops Sonos
    Roam to night volume. Press when it is enabled: disables it, shuts the heater
    plug off, restores the light to its 1% night glow and the Roam to normal volume.
    Sends Andrew a notification each way because the knob gives no feedback of its
    own. The knob has two firmware modes toggled by a fast triple press: command
    mode (factory default, single press sends "toggle") and event mode (single press
    sends "remote_button_short_press"). Both triggers are listed so the automation
    works in either mode. No device filter is needed while the knob is the only
    device on the ZHA network; if another ZHA remote is ever added, add its
    device_ieee to event_data to keep the triggers apart.

    '
  triggers:
  - id: press_command_mode
    trigger: event
    event_type: zha_event
    event_data:
      command: toggle
  - id: press_event_mode
    trigger: event
    event_type: zha_event
    event_data:
      command: remote_button_short_press
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: automation.nursery_heater_control_67_70_degrees
        state: 'off'
      sequence:
      - action: automation.turn_on
        target:
          entity_id: automation.nursery_heater_control_67_70_degrees
      - action: automation.trigger
        data:
          skip_condition: false
        target:
          entity_id: automation.nursery_heater_control_67_70_degrees
      - action: light.turn_off
        target:
          entity_id: light.staircase_hue_lights_hue_white_lamp_middle_staircase
      - action: media_player.volume_set
        data:
          volume_level: 0.04
        target:
          entity_id: media_player.sonos_roam
      - action: notify.mobile_app_pixel_10
        data:
          message: 'Nursery night mode ON (knob): heater automation enabled'
    default:
    - action: automation.turn_off
      data:
        stop_actions: true
      target:
        entity_id: automation.nursery_heater_control_67_70_degrees
    - action: switch.turn_off
      target:
        entity_id: switch.tapo_p110m_2_nursery_heater
    - action: light.turn_on
      data:
        brightness_pct: 1
      target:
        entity_id: light.staircase_hue_lights_hue_white_lamp_middle_staircase
    - action: media_player.volume_set
      data:
        volume_level: 0.32
      target:
        entity_id: media_player.sonos_roam
    - action: notify.mobile_app_pixel_10
      data:
        message: 'Nursery night mode OFF (knob): heater automation disabled, heater
          off'
  mode: single
- id: '09000001'
  alias: 'Desktop: Heartbeat marks the PC awake'
  description: 'The desktop POSTs this webhook once a minute from the "HA Desktop
    Heartbeat" Windows scheduled task (installed by desktop/install-heartbeat.ps1)
    whenever it is awake with Andrew logged in; locked still counts, and heartbeats
    stop on sleep, shutdown, or sign-out. Each POST stamps
    input_datetime.desktop_last_heartbeat, and binary_sensor.desktop_on shows the
    Wake Desktop tile as running while the stamp is under 3 minutes old. local_only
    keeps the unauthenticated webhook reachable from the LAN only.'
  triggers:
  - trigger: webhook
    webhook_id: desktop-heartbeat-e9f6ccd24a0242d9870d86a50f04eceea1a3d2685e4a43a5a6b2a99295bcf178
    allowed_methods:
    - POST
    local_only: true
  conditions: []
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.desktop_last_heartbeat
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  mode: single
- id: '10000003'
  alias: 'PECO: High Estimated Daily Cost Alert'
  description: Notifies once at 9:15pm if today's combined tracked-device +
    HVAC estimated cost (sensor.estimated_whole_home_cost_today) exceeds
    input_number.peco_bill_alert_threshold, so a high-usage day shows up the
    same day rather than a month later on the bill. Still an underestimate of
    the true whole-home cost (no whole-home meter), so this is an early
    warning, not a precise forecast.
  triggers:
  - trigger: time
    at: '21:15:00'
  conditions:
  - condition: numeric_state
    entity_id: sensor.estimated_whole_home_cost_today
    above: input_number.peco_bill_alert_threshold
  actions:
  - action: notify.mobile_app_pixel_10
    data:
      title: High Estimated Usage Today
      message: >-
        Estimated cost today (tracked devices + HVAC) is
        ${{ states('sensor.estimated_whole_home_cost_today') }}, above your
        ${{ states('input_number.peco_bill_alert_threshold') }} threshold.
        This still excludes the fridge, water heater, and general circuits.
  mode: single
- id: '10000001'
  alias: 'PECO: Heavy AC Day Alert'
  description: Notifies once at 9pm if the Nest ran cooling longer than
    input_number.hvac_cooling_alert_hours today, so a hot-weather usage
    spike shows up the same day instead of a month later on the bill.
  triggers:
  - trigger: time
    at: '21:00:00'
  conditions:
  - condition: numeric_state
    entity_id: sensor.hvac_cooling_hours_today
    above: input_number.hvac_cooling_alert_hours
  actions:
  - action: notify.mobile_app_pixel_10
    data:
      title: Heavy AC Day
      message: >-
        Cooling ran {{ states('sensor.hvac_cooling_hours_today') }}h today
        (est. ${{ states('sensor.hvac_cooling_cost_today') }}). Outdoor high
        was {{ states('sensor.outdoor_temperature_openmeteo') }}°F.
  mode: single
- id: '10000002'
  alias: 'PECO: Previous Balance Reminder'
  description: Weekly nag on Mondays if input_number.peco_previous_balance
    is still above zero, so an unpaid balance from a missed payment doesn't
    quietly ride along and rack up more late fees.
  triggers:
  - trigger: time
    at: '09:00:00'
  conditions:
  - condition: time
    weekday:
    - mon
  - condition: state
    entity_id: binary_sensor.peco_account_past_due
    state: 'on'
  actions:
  - action: notify.mobile_app_pixel_10
    data:
      title: PECO Balance Still Open
      message: >-
        ${{ states('input_number.peco_previous_balance') }} previous balance
        is still on the account. Zero out input_number.peco_previous_balance
        once it's paid.
  mode: single
- id: '1786291200000'
  alias: 'Cameras: Flag new camera firmware'
  description: >-
    The nursery camera upgraded itself from firmware 1.5.3 to 1.5.4 at 06:44 on
    2026-08-03 and its live stream stopped working that morning, so new firmware
    is worth hearing about before it installs itself. This only sends the alert.
    It used to also switch each camera's "automatically upgrade firmware" setting
    off, but the cameras rejected every one of those calls with "Invalid login
    credentials" (error -40209) and the automation threw an unhandled exception
    on all 4 daily runs from 2026-08-09 on. The switch was never actually being
    held off, so turn auto-upgrade off in the Tapo app instead. Restoring that
    action here means fixing the tapo_control credentials first.
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    hours: /6
  conditions: []
  actions:
  # Match by name instead of a fixed entity_id list. Renaming a camera in the Tapo
  # app rewrites its entity IDs (the nursery already went cole_cam -> nursery_cam),
  # which would quietly break a hardcoded list.
  - variables:
      pending: >-
        {{ states.update
           | selectattr('entity_id', 'search', 'cam.*_update$')
           | selectattr('state', 'eq', 'on')
           | map(attribute='name') | list }}
  - if:
    - condition: template
      value_template: '{{ pending | count > 0 }}'
    then:
    - action: notify.mobile_app_pixel_10
      data:
        title: Camera Firmware
        message: >-
          New Tapo camera firmware is available: {{ pending | join(', ') }}.
          Install it by hand, then check the nursery live stream still works.
  mode: single
- id: tplink_manual_poll_30s
  alias: 'TP-Link: manual 30s poll'
  description: >-
    Replaces the TP-Link integration's built-in 5-second polling, which is
    disabled per config entry under Settings > Devices & services > TP-Link >
    System options. At 5 seconds the plugs wrote ~73,700 state rows a day, more
    than every other integration combined, and all of it lands on the SD card
    that also holds swap. The 2026-08-18 freeze was swap thrashing against that
    card, so cutting plug writes ~6x frees I/O for swap. Nothing depends on
    fast wattage: no automation reads current_consumption, and the energy
    package only needs it for running totals.

    One entity per device is enough. Refreshing any entity refreshes that
    device's whole coordinator, so every sensor on the plug updates with it.
    The P316M strip is a single host, so its one target covers all six outlets.
  triggers:
  - trigger: time_pattern
    seconds: /30
  conditions: []
  actions:
  - action: homeassistant.update_entity
    target:
      entity_id:
      - switch.chest_freezer
      - switch.guest_bedroom_desk_plug
      - switch.master_bedroom_devices_bedroom_humidifier
      - switch.ninja_toaster
      - switch.tapo_3_prong_power_strip
      - switch.tapo_p110m_2_nursery_heater
      - switch.tapo_p110m_3
      - switch.tapo_p110m_4_basement_heater
      # Covers the whole P316M strip. Deliberately not the router_ha outlet,
      # which powers this Home Assistant instance.
      - switch.first_floor_devices_tapo_p316m_1_tapo_p316m_sonos
  mode: single
  max_exceeded: silent
