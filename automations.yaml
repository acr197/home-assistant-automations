- id: '1761698231251'
  alias: 'Nursery: Heater on/off 69/72 degrees with Hatch'
  description: 'Heater turns on below 69, stays on until 72. Turns off when thermostat
    heats, temp exceeds 72, or sensor goes unavailable. Turns on immediately when
    AC kicks in. Only runs 8pm–7am when Andrew or Amy are home, or guest mode is on.
    Re-checks every 5 minutes. Hard shutoff at 7:01am no matter what.

    '
  triggers:
  - id: morning_off
    trigger: time
    at: 07:01:00
  - id: temp_low
    trigger: numeric_state
    entity_id: sensor.govee_thermometer_nursery_h5104_temperature
    below: 69
  - id: temp_high
