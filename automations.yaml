- id: '04030001'
  alias: 'Staircase/Nursery: Middle Light & Sonos Roam follow Hatch'
  description: Turn off middle stairwell light and lower Sonos Roam when Hatch plays;
    restore when it stops. If Hatch stops between 6:00–9:00 AM, turn on first-floor
    lights.
  triggers:
  - entity_id: media_player.my_rest_media_player
    to: playing
    trigger: state
  - entity_id: media_player.my_rest_media_player
    to: idle
    trigger: state
  - entity_id: media_player.my_rest_media_player
    to: 'off'
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: media_player.my_rest_media_player
        state: playing
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.staircase_hue_lights_hue_white_lamp_middle_staircase
      - action: media_player.volume_set
        data:
          volume_level: 0.04
        target:
          entity_id: media_player.sonos_roam
      - action: media_player.volume_set
        data:
          volume_level: 0.1
        target:
          entity_id:
          - media_player.living_room
      - type: turn_on
        device_id: c1b871d5b16a58666e4203019013ed71
        entity_id: 350ea9fb02988c5e6aa30a179eaaf495
        domain: light
        brightness_pct: 5
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: media_player.my_rest_media_player
          state: 'off'
        - condition: state
          entity_id: media_player.my_rest_media_player
          state: idle
      - condition: time
        after: 06:00:00
        before: 09:00:00
      sequence:
      - action: light.turn_on
        data:
          brightness_pct: 100
        target:
          entity_id: light.living_room
      - type: turn_on
        device_id: 04e5ec7ea7ad3c6181ea16ab5c6a8aa7
        entity_id: 238fb0e74da17beb1b0bc7e194da08ad
        domain: light
        brightness_pct: 25
      - action: media_player.volume_set
        data:
          volume_level: 0.22
        target:
          entity_id: media_player.sonos_roam
    default:
    - action: light.turn_on
      target:
        entity_id: light.staircase_hue_lights_hue_white_lamp_middle_staircase
      data:
        brightness_pct: 1
    - action: media_player.volume_set
      data:
        volume_level: 0.32
      target:
        entity_id: media_player.sonos_roam
  mode: single
