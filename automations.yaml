    conditions:
    - condition: device
      device_id: f3c1f908ad1c39e5ed8dfa9044b5928b
      domain: climate
      entity_id: 83bf4ddaf2623abe339f2f951a0d157f
      type: is_hvac_mode
      hvac_mode: heat
    - condition: device
      device_id: f3c1f908ad1c39e5ed8dfa9044b5928b
      domain: climate
      entity_id: 83bf4ddaf2623abe339f2f951a0d157f
      type: is_hvac_mode
      hvac_mode: heat_cool
  actions:
  - device_id: f3c1f908ad1c39e5ed8dfa9044b5928b
    domain: climate
    entity_id: 83bf4ddaf2623abe339f2f951a0d157f
    type: set_preset_mode
    preset_mode: none
  mode: single
