- id: '01000001'
  alias: 'Geolocation: Lights & Thermostat On When Arriving Home'
  description: Turn HVAC to normal and bring up main lights when someone arrives;
    also turn on middle stairwell to 1%.
  triggers:
  - id: andrew_arrives
    entity_id: person.andrew
    to: home
    trigger: state
  - id: amy_arrives
    entity_id: person.amy
    to: home
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: andrew_arrives
      - condition: not
        conditions:
        - condition: state
          entity_id: person.amy
          state: home
      sequence:
      - target:
          entity_id: climate.thermostat
        data:
          preset_mode: none
        action: climate.set_preset_mode
      - target:
          area_id: main_level_lights
        data:
          transition: 5
          brightness_pct: 100
        action: light.turn_on
      - target:
          entity_id: light.staircase_hue_lights_hue_white_lamp_middle_staircase
        data:
          brightness_pct: 1
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: amy_arrives
      - condition: not
        conditions:
        - condition: state
          entity_id: person.andrew
          state: home
      sequence:
      - target:
          entity_id: climate.thermostat
        data:
          preset_mode: none
        action: climate.set_preset_mode
      - target:
          area_id: main_level_lights
        data:
          transition: 5
          brightness_pct: 100
        action: light.turn_on
      - target:
          entity_id: light.staircase_hue_lights_hue_white_lamp_middle_staircase
        data:
          brightness_pct: 1
        action: light.turn_on
  mode: single
- id: '01000002'
  alias: 'Geolocation: Lights & Thermostat Off When Leaving Home'
  description: 'Shut the house down once it has been empty for 5 continuous minutes.
    The 5-minute hold is a GPS debounce, not a courtesy delay. Andrew''s Pixel 10
    intermittently reports a coarse fix (gps_accuracy 200m, landing ~930m from home,
    outside the 500m Home zone) that reads as not_home for 6-60 seconds before the
    good fix returns. On 2026-08-08/09 six of those false departures blacked out
    24-42 lights each while he was sitting in the house, because Amy was genuinely
    away so the everyone-is-out test passed. Triggering off the group instead of the
    two people also fixes a second bug: a per-person "from: home" trigger would miss
    a real departure to Andrew-Work, which is only ~1.7km away and reachable inside
    the hold. The group stays not_home across a not_home to zone transition, so the
    timer never resets on the way out.'
  triggers:
  - trigger: state
    entity_id: group.household_anyone_home
    to: not_home
    for: '00:05:00'
  conditions: []
  actions:
  - data:
      preset_mode: eco
    action: climate.set_preset_mode
    target:
      entity_id: climate.thermostat
  - target:
      area_id:
      - basement_hue_lights
      - crawl_space_hue_lights
      - kitchen_deck_hue_light
      - tv_play_lights
      - crawl_space
      - hallway
      - main_level_lights
      - master_bedroom_lights
      - office_lights
    data:
      transition: 10
    action: light.turn_off
  - type: turn_off
    device_id: 38c1108cd980f3202ed7bb5897d2e0e0
    entity_id: 243f87a8269b1f3cf446847dbfa0795d
    domain: remote
  mode: single
- id: '02020101'
  alias: 'Living Room: Cap Hue Lamps at 70%'
  description: Hue Living Room lamps 2 and 5 must never exceed 70% brightness. Snap
    whichever one goes higher straight back to 70%, no matter what set it there (Hue
    app, a scene, or a dimmer).
  triggers:
  - trigger: numeric_state
    entity_id:
    - light.hue_color_lamp_living_room_2
    - light.hue_color_lamp_living_room_5
    attribute: brightness
    above: 178
  conditions: []
  actions:
  - action: light.turn_on
    target:
      entity_id: '{{ trigger.entity_id }}'
    data:
      brightness_pct: 70
      transition: 1
  mode: parallel
  max: 10
- id: '02020103'
  alias: 'Living Room: Cap Hue Lamp 3 at 40% and Lock 2700K'
  description: Hue Living Room lamp 3 holds at 40% brightness and stays locked to
    2700K. Snap brightness back to 40% whenever it climbs higher, and pull color back
    to 2700K whenever a scene or manual change moves it off, at any brightness from
    1-100%.
  triggers:
  - trigger: numeric_state
    entity_id: light.hue_color_lamp_living_room_3
    attribute: brightness
    above: 104
    id: brightness_cap
  - trigger: state
    entity_id: light.hue_color_lamp_living_room_3
    attribute: color_temp_kelvin
    id: color_lock
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: brightness_cap
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.hue_color_lamp_living_room_3
        data:
          brightness_pct: 40
          transition: 1
    - conditions:
      - condition: trigger
        id: color_lock
      - condition: state
        entity_id: light.hue_color_lamp_living_room_3
        state: 'on'
      - condition: template
        value_template: '{{ (state_attr(''light.hue_color_lamp_living_room_3'', ''color_temp_kelvin'')
          | int(0) - 2700) | abs > 25 or state_attr(''light.hue_color_lamp_living_room_3'',
          ''color_mode'') != ''color_temp'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.hue_color_lamp_living_room_3
        data:
          color_temp_kelvin: 2700
          transition: 1
  mode: parallel
  max: 10
- id: '02020102'
  alias: 'Living Room: Bar Cart Brightness Based on Room Brightness'
  description: Keep the bar cart switch in sync with Living Room lamp brightness and
    presence.
  triggers:
  - trigger: numeric_state
    entity_id: light.hue_color_lamp_living_room_1
    attribute: brightness
    above: 10
  - trigger: numeric_state
    entity_id: light.hue_color_lamp_living_room_1
    attribute: brightness
    below: 11
  - trigger: state
    entity_id: light.hue_color_lamp_living_room_1
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: group.household_anyone_home
        state: not_home
      sequence:
      - action: switch.turn_off
        target:
          device_id: 0bd4a90c86eae6fe3052348e14462756
    - conditions:
      - condition: state
        entity_id: light.hue_color_lamp_living_room_1
        state: 'off'
      sequence:
      - action: switch.turn_off
        target:
          device_id: 0bd4a90c86eae6fe3052348e14462756
    - conditions:
      - condition: state
        entity_id: light.hue_color_lamp_living_room_1
        state: 'on'
      sequence:
      - action: switch.turn_on
        target:
          device_id: 0bd4a90c86eae6fe3052348e14462756
  mode: single
- id: '02020104'
  alias: 'Living Room: Hue 2 & 5 Follow Room Brightness (Max 70%)'
  description: Hue Living Room lamps 2 and 5 mirror lamp 1, the room brightness reference.
    They follow lamp 1 on, off, and dimming, but hold at 70% whenever lamp 1 is brighter
    than 70%.
  triggers:
  - trigger: state
    entity_id: light.hue_color_lamp_living_room_1
  conditions: []
  actions:
  - delay:
      milliseconds: 500
  - choose:
    - conditions:
      - condition: state
        entity_id: light.hue_color_lamp_living_room_1
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.hue_color_lamp_living_room_2
          - light.hue_color_lamp_living_room_5
        data:
          brightness_pct: '{{ [ (state_attr(''light.hue_color_lamp_living_room_1'',
            ''brightness'') | float(0) / 255 * 100) | round(0) | int, 70 ] | min }}'
          transition: 1
    - conditions:
      - condition: state
        entity_id: light.hue_color_lamp_living_room_1
        state: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.hue_color_lamp_living_room_2
          - light.hue_color_lamp_living_room_5
        data:
          transition: 1
  mode: restart
- id: '02030201'
  alias: 'Staircase: Keep Lower Wall Light On'
  description: Maintain a nightlight on the lower stairwell wall (1% after 8pm, 20%
    during day) when anyone is home.
  triggers:
  - event: start
    trigger: homeassistant
  - at: 08:00:00
    trigger: time
  - at: '20:00:00'
    trigger: time
  - entity_id: person.andrew
    to: home
    trigger: state
  - entity_id: person.amy
    to: home
    trigger: state
  - entity_id: light.hue_candle_lower_staircase
    trigger: state
  - entity_id: light.hue_candle_lower_staircase
    from: unavailable
    trigger: state
  conditions:
  - condition: state
    entity_id: group.household_anyone_home
    state: home
  actions:
  - variables:
      pct: '{{ 1 if (now().hour >= 1 or now().hour < 8) else 20 }}'
  - target:
      entity_id: light.hue_candle_lower_staircase
    data:
      brightness_pct: '{{ pct }}'
      color_temp_kelvin: 2222
    action: light.turn_on
  mode: single
- id: '02040101'
  alias: 'Staircase: Turn Off Upper Light in 30s if Bedroom Light Is Off'
  description: Small pathlight after bedroom lights go off late at night; top stairwell
    warm 1% for 30s.
  triggers:
  - trigger: state
    entity_id:
    - light.hue_white_lamp_top_br_dresser
    from: 'on'
    to: 'off'
  actions:
  - target:
      entity_id: light.hue_candle_upper_staircase
    data:
      brightness_pct: 1
      color_temp_kelvin: 2200
    action: light.turn_on
  - delay: 00:00:30
  - condition: state
    entity_id: light.hue_white_lamp_top_br_dresser
    state: 'off'
  - target:
      entity_id: light.hue_candle_upper_staircase
    action: light.turn_off
  mode: single
- id: '03000002'
  alias: 'Thermostat: Exit Eco at 1:30PM if >76° and Both at Work'
  description: Midday comfort rule for hot days when both are at work.
  triggers:
  - trigger: time
    at:
    - '13:30:00'
    - '14:00:00'
    - '14:30:00'
    - '15:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.guest_mode
    state: 'off'
  - condition: zone
    entity_id: person.amy
    zone: zone.amy_work
  - condition: zone
    entity_id: person.andrew
    zone: zone.andrew_work
  - condition: device
    device_id: f3c1f908ad1c39e5ed8dfa9044b5928b
    domain: climate
    entity_id: 83bf4ddaf2623abe339f2f951a0d157f
    type: is_hvac_mode
    hvac_mode: cool
  - condition: numeric_state
    entity_id: sensor.thermostat_temperature
    above: 76
  actions:
  - target:
      entity_id: climate.thermostat
    data:
      preset_mode: none
    action: climate.set_preset_mode
  mode: single
- id: '03000003'
  alias: 'Thermostat: Exit Eco at 1:30PM if ≤64° heat modes and Both at Work'
  description: Midday comfort rule for cold days when both are at work (heat/heat_cool
    and temp under 64).
  triggers:
  - trigger: time
    at:
    - '13:30:00'
    - '14:00:00'
    - '14:30:00'
    - '15:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.guest_mode
    state: 'off'
