- id: '06000001'
  alias: 'System: Auto Update All'
  description: 'Sundays at 6am, an hour after the 5am automatic backup. Installs add-on,
    integration, HACS, and Supervisor updates, pushes the config to GitHub, then restarts
    to apply them. The 7am "System: Post-Update Settle Restart" automation does the
    cleanup pass. Home Assistant Core and OS are held back on purpose, since installing
    those can hang the box with no one around to power-cycle it; it just notifies that
    they are pending. Device firmware (ESPHome, cameras, Z-Wave) is skipped by device_class.
    Install order matters: Supervisor goes first and alone, because updating it restarts
    the Supervisor container, and an add-on install running alongside that restart is
    what leaves add-ons half-started ("App failed to start at boot").'
  triggers:
  - trigger: time
    at: 06:00:00
  conditions:
  - condition: time
    weekday:
    - sun
  variables:
    held_back_updates:
    - update.home_assistant_core_update
    - update.home_assistant_operating_system_update
    supervisor_update: update.home_assistant_supervisor_update
  actions:
  # Never install on top of a running backup. The Sunday backup normally finishes by
  # 5am, but a slow one would otherwise collide with the first add-on install.
  - wait_template: '{{ is_state(''sensor.backup_backup_manager_state'', ''idle'') }}'
    timeout: '00:30:00'
    continue_on_timeout: true
  # Flag the cycle for the 7am settle pass, which is the only thing that clears it.
  # Set here rather than at the end so the settle pass still runs if this one dies.
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.auto_update_running
  # Force a fresh check. Update entities can be stale at trigger time and a stale "off"
  # hides an available update, so nothing would install. Firmware entities are left out:
  # they poll cameras and ESP devices, which slows the refresh down for updates this
  # automation will not install anyway.
  - action: homeassistant.update_entity
    continue_on_error: true
    target:
      entity_id: '{{ states.update | rejectattr(''attributes.device_class'', ''eq'',
        ''firmware'') | map(attribute=''entity_id'') | list }}'
  - delay: '00:03:00'
  - variables:
      pending: '{{ states.update | selectattr(''state'', ''eq'', ''on'') | rejectattr(''attributes.device_class'',
        ''eq'', ''firmware'') | map(attribute=''entity_id'') | list }}'
      supervisor_pending: '{{ pending | select(''eq'', supervisor_update) | list }}'
      other_updates: '{{ pending | reject(''in'', held_back_updates) | reject(''eq'',
        supervisor_update) | list }}'
      core_updates: '{{ states.update | selectattr(''state'', ''eq'', ''on'') | selectattr(''entity_id'',
        ''in'', held_back_updates) | map(attribute=''entity_id'') | list }}'
  # Supervisor on its own, then let it come all the way back before touching add-ons.
  - if:
    - condition: template
      value_template: '{{ supervisor_pending | count > 0 }}'
    then:
    - action: update.install
      continue_on_error: true
      target:
        entity_id: '{{ supervisor_update }}'
      data:
        backup: false
    - delay: '00:03:00'
  # Everything else one at a time, pausing after each so Supervisor finishes restarting
  # that add-on before the next install starts.
  - repeat:
      for_each: '{{ other_updates }}'
      sequence:
      - action: update.install
        continue_on_error: true
        target:
          entity_id: '{{ repeat.item }}'
        data:
          backup: false
      - delay: '00:00:45'
  # HACS updates rewrite custom_components/ and www/, so push before the restart.
  - action: shell_command.git_push
    continue_on_error: true
  - variables:
      installed: '{{ supervisor_pending + other_updates }}'
  - action: notify.mobile_app_pixel_10
    continue_on_error: true
    data:
      title: HA Auto-Update
      message: '{% set names = installed | map(''replace'', ''update.'', '''') | map(''replace'',
        ''_update'', '''') | map(''replace'', ''_'', '' '') | list %}Installed {{ installed
        | count }}{% if names %}: {{ names | join('', '') }}{% endif %}. Core/OS pending:
        {{ core_updates | count }} (install manually). Settle restart at 7am.'
  # Only restart now if something installed. The 7am pass restarts either way, so an
  # empty week costs nothing.
  - if:
    - condition: template
      value_template: '{{ installed | count > 0 }}'
    then:
    - delay: '00:02:00'
    - action: homeassistant.restart
  mode: single
- id: '06000002'
  alias: 'System: Post-Update Settle Restart'
  description: 'Sundays at 7am, the cleanup pass for "System: Auto Update All". Two
    things go wrong after an update run and neither fixes itself: an add-on can fail
    to come back (Supervisor raises "App failed to start at boot", and when it is Samba
    the Z: share disappears), and homeassistant.restart only restarts Core, so it can
    never revive a dead add-on. This waits for the update run to finish, starts any
    add-on that is not running, then does one final full restart to pick up anything
    that landed in the background after the update automation had already looked. Runs
    whether or not updates were found, and clears the cycle flag so it fires once per
    run.'
  triggers:
  - trigger: time
    at: 07:00:00
  # Backstop: if HA is still restarting at 7am the time trigger is missed outright,
  # so also check on startup for the rest of Sunday morning.
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.auto_update_running
    state: 'on'
  - condition: template
    value_template: '{{ now().weekday() == 6 and now().hour >= 7 and now().hour < 12
      }}'
  variables:
    # Add-on slug -> its "running" binary sensor. The slugs are the Supervisor device
    # identifiers, which is what hassio.addon_start expects. A sensor that is missing
    # or disabled reads as not-running, so the start below still fires; starting an
    # add-on that is already up is a harmless no-op swallowed by continue_on_error.
    addons:
      core_samba: binary_sensor.samba_share_running
      core_ssh: binary_sensor.terminal_ssh_running
      core_duckdns: binary_sensor.duck_dns_running
      core_zwave_js: binary_sensor.z_wave_js_running
      '5c53de3b_esphome': binary_sensor.esphome_running
      core_configurator: binary_sensor.file_editor_running
      a0d7b954_vscode: binary_sensor.studio_code_server_running
  actions:
  # Do not restart on top of a still-running update or backup.
  - wait_template: '{{ state_attr(''automation.system_auto_update_all'', ''current'')
      | int(0) == 0 and is_state(''sensor.backup_backup_manager_state'', ''idle'') }}'
    timeout: '00:45:00'
    continue_on_timeout: true
  - variables:
      down: '{{ addons.values() | reject(''is_state'', ''on'') | list }}'
  - repeat:
      for_each: '{{ addons.keys() | list }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ not is_state(addons[repeat.item], ''on'') }}'
        then:
        - action: hassio.addon_start
          continue_on_error: true
          data:
            addon: '{{ repeat.item }}'
        - delay: '00:00:20'
  # Only report a partial failure. If every sensor reads not-running then the sensors
  # are disabled rather than the add-ons being down, the starts above were no-ops, and
  # there is nothing worth a 7am push notification.
  - if:
    - condition: template
      value_template: '{{ down | count > 0 and down | count < addons | count }}'
    then:
    - action: notify.mobile_app_pixel_10
      continue_on_error: true
      data:
        title: HA Auto-Update
        message: 'Restarted {{ down | count }} add-on(s) that did not come back: {{
          down | map(''replace'', ''binary_sensor.'', '''') | map(''replace'', ''_running'',
          '''') | map(''replace'', ''_'', '' '') | join('', '') }}.'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.auto_update_running
  - delay: '00:01:00'
  - action: homeassistant.restart
  mode: single
- id: '07010101'
  alias: 'Basement Hue Tap Dial: Rotary — Sonos Volume Control'
  description: >-
    Rotate the dial to set the volume on media_player.basement (the SYMFONISK
    picture frame).

    Listens to the raw hue_event bus event instead of a `domain: hue` device
    trigger. The device triggers silently stopped attaching after the 2026-08-05
    restart: the dial kept firing identical hue_events but this automation never
    ran again. The event trigger matches the exact payload the dial sends, so it
    does not depend on the Hue device-automation layer.

    Smoothing. The dial sends a batch roughly every 400ms carrying a `steps`
    count, starting with type `start` and then `repeat`. The old version ignored
    `start`, so the first move of every turn was dropped and a short flick did
    nothing. It also scaled straight off `steps`, and a fast spin sends batches
    of 90+ steps, which is where the ~20-point jumps came from. Now every batch
    counts, and the change is damped and capped at 8 points per batch: a fast
    spin still ramps at about 20 points/sec across several batches instead of
    leaping in one.

    Each batch adds to input_number.basement_volume_target rather than to the
    speaker's reported volume. Sonos reports a new volume back over the network a
    beat after it is set, so consecutive batches used to read the same stale
    value and overwrite each other, which is why turning fast often moved the
    volume only one step. The target re-syncs from the speaker at the start of
    each turn and after 3s idle, so a volume change made in the Sonos app or on a
    dashboard is still picked up.
  triggers:
  - trigger: event
    event_type: hue_event
    event_data:
      device_id: f51ebbabc5d2ee26b85cd5fcce863ac1
      subtype: clock_wise
  - trigger: event
    event_type: hue_event
    event_data:
      device_id: f51ebbabc5d2ee26b85cd5fcce863ac1
      subtype: counter_clock_wise
  actions:
  - variables:
      steps: '{{ trigger.event.data.steps | int(15) }}'
      direction: '{{ 1 if trigger.event.data.subtype == ''clock_wise'' else -1 }}'
      delta: >-
        {{ [[ (2 + (steps - 15) * 0.08) | round | int, 1 ] | max, 8 ] | min }}
      resync: >-
        {{ trigger.event.data.type == 'start'
           or (now() - states.input_number.basement_volume_target.last_reported).total_seconds() > 3 }}
      base: >-
        {{ (state_attr('media_player.basement','volume_level') | float(0) * 100) | round | int
           if resync else states('input_number.basement_volume_target') | float(0) | round | int }}
      target: >-
        {{ [[ base + direction * delta, 0 ] | max, 100 ] | min }}
  - action: input_number.set_value
    target:
      entity_id: input_number.basement_volume_target
    data:
      value: '{{ target }}'
  - action: media_player.volume_set
    target:
      entity_id: media_player.basement
    data:
      volume_level: '{{ target / 100 }}'
  mode: queued
  max: 10
- id: '07010102'
  alias: 'Basement Hue Tap Dial: Button 3 Press — Unmute Sonos'
  description: >-
    Quick press of button 3 unmutes Sonos Basement. On the raw hue_event for the
    same reason as the rotary automation above. Fires on short_release rather
    than initial_press, so a press-and-hold no longer unmutes on its way to
    muting.
  triggers:
  - trigger: event
    event_type: hue_event
    event_data:
      device_id: f51ebbabc5d2ee26b85cd5fcce863ac1
      type: short_release
      subtype: 3
  actions:
  - action: media_player.volume_mute
    target:
      entity_id: media_player.basement
    data:
      is_volume_muted: false
  mode: single
- id: '07010103'
  alias: 'Basement Hue Tap Dial: Button 3 Hold — Mute Sonos'
  description: >-
    Hold button 3 to mute Sonos Basement. On the raw hue_event for the same
    reason as the rotary automation above. Fires once on long_press instead of
    on every repeat event sent while the button is held down.
  triggers:
  - trigger: event
    event_type: hue_event
    event_data:
      device_id: f51ebbabc5d2ee26b85cd5fcce863ac1
      type: long_press
      subtype: 3
  actions:
  - action: media_player.volume_mute
    target:
      entity_id: media_player.basement
    data:
      is_volume_muted: true
  mode: single
