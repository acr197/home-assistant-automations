# ========================================================
#  ENERGY & COST MONITORING  (package)
#
#  Self-contained package for the Energy dashboard: input helpers, PECO
#  utility rates, energy meters, and computed power/cost sensors. Split out
#  of configuration.yaml so this project can grow without bloating the core
#  config. Loaded via: homeassistant > packages > !include_dir_named packages
# ========================================================

# Comma-separated entity slugs the dashboard hides from whole-home totals
input_text:
  energy_hidden_devices:
    name: "Hidden Energy Devices"
    max: 255
    icon: mdi:eye-off

# PECO utility rates (feed the cost templates) + last-bill reference values (manual entry)
input_number:
  peco_delivery_rate:
    name: PECO Delivery Rate
    unit_of_measurement: "$/kWh"
    min: 0
    max: 1
    step: 0.00001
    mode: box
    icon: mdi:transmission-tower
    initial: 0.10276
  peco_supply_rate:
    name: PECO Supply Rate
    unit_of_measurement: "$/kWh"
    min: 0
    max: 1
    step: 0.00001
    mode: box
    icon: mdi:flash
    initial: 0.10785
  peco_transmission_rate:
    name: PECO Transmission Rate
    unit_of_measurement: "$/kWh"
    min: 0
    max: 1
    step: 0.00001
    mode: box
    icon: mdi:lightning-bolt
    initial: 0.00974
  peco_customer_charge:
    name: PECO Customer Charge
    unit_of_measurement: "$/mo"
    min: 0
    max: 100
    step: 0.01
    mode: box
    icon: mdi:account-cash
    initial: 11.30
  # Last real bill on file: 07/20/2026, service period 06/18-07/20/2026 (32 days).
  # Update these three whenever a new bill arrives so the coverage/ground-truth
  # sensors below stay meaningful. Use the "New Charges" amount, not the total
  # amount due, since total-due can include a carried-over unpaid balance.
  peco_last_bill_amount:
    name: PECO Last Bill Amount
    unit_of_measurement: "$"
    min: 0
    max: 10000
    step: 0.01
    mode: box
    icon: mdi:receipt-text
    initial: 335.49
  peco_last_bill_kwh:
    name: PECO Last Bill kWh
    unit_of_measurement: "kWh"
    min: 0
    max: 100000
    step: 1
    mode: box
    icon: mdi:counter
    initial: 1471
  peco_last_bill_days:
    name: PECO Last Bill Days
    unit_of_measurement: "days"
    min: 1
    max: 365
    step: 1
    mode: box
    icon: mdi:calendar-range
    initial: 32
  # Unpaid balance carried on the account, e.g. from a missed payment. Set this
  # from the "Charges/Credits from previous bill" line on a new bill; zero it
  # out once paid. Drives the past-due alert below so a missed payment doesn't
  # go unnoticed again.
  peco_previous_balance:
    name: PECO Previous Balance
    unit_of_measurement: "$"
    min: 0
    max: 10000
    step: 0.01
    mode: box
    icon: mdi:alert-circle
    initial: 211.48
  # Notify once/day if today's combined tracked-device + HVAC estimated cost
  # (sensor.estimated_whole_home_cost_today, see packages/hvac.yaml) exceeds
  # this. Default matches the last real bill's $/day (335.49 / 32 days).
  # Still an underestimate (no water heater/fridge/lighting), so treat it as
  # an early-warning tripwire, not a precise forecast.
  peco_bill_alert_threshold:
    name: PECO Daily Cost Alert Threshold
    unit_of_measurement: "$"
    min: 0
    max: 200
    step: 0.5
    mode: box
    icon: mdi:bell-alert
    initial: 10.5
  billing_cycle_start_day:
    name: Billing Cycle Start Day
    unit_of_measurement: "day"
    min: 1
    max: 28
    step: 1
    mode: box
    icon: mdi:calendar-start
    initial: 1

# Time-range selector for the energy charts
input_select:
  energy_chart_period:
    name: Energy Chart Period
    options:
      - 7d
      - 14d
      - 30d
    initial: 14d
    icon: mdi:calendar-range

# Tumble dryer energy meters - daily/monthly cycles off the Miele consumption sensor
utility_meter:
  tumble_dryer_today:
    source: sensor.tumble_dryer_energy_consumption
    cycle: daily
    name: "Tumble Dryer Today's Consumption"
  tumble_dryer_month:
    source: sensor.tumble_dryer_energy_consumption
    cycle: monthly
    name: "Tumble Dryer This Month's Consumption"

# ---- Computed energy & cost sensors ----
template:
  # Blended PECO rate: delivery + supply + transmission ($/kWh)
  - sensor:
      - name: "PECO Variable Rate"
        unique_id: peco_variable_rate
        unit_of_measurement: "$/kWh"
        state: >
          {{ (states('input_number.peco_delivery_rate') | float(0) +
              states('input_number.peco_supply_rate') | float(0) +
              states('input_number.peco_transmission_rate') | float(0)) | round(5) }}

  # Live whole-home power: refreshed every 60s for the dashboard tile
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
    sensor:
      - name: "Total Power Draw Now"
        unique_id: total_power_draw_now
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set raw = states('input_text.energy_hidden_devices') %}
          {% set hidden = (raw if raw not in [none,'unknown','unavailable'] else '').split(',') | reject('eq','') | list %}
          {% set ns = namespace(total=0) %}
          {% for s in states.sensor
              if s.attributes.get('device_class') == 'power'
              and s.attributes.get('unit_of_measurement') == 'W'
              and 'total_' not in s.entity_id
              and s.state not in ['unavailable','unknown'] %}
            {% set slug = s.entity_id | replace('sensor.','') | replace('_current_consumption','') | replace('_power','') %}
            {% if slug not in hidden %}
              {% set ns.total = ns.total + (s.state | float(0)) %}
            {% endif %}
          {% endfor %}
          {{ ns.total | round(1) }}

  # Slow totals and costs: recomputed every 5 min (and on rate / hidden-list changes)
  - trigger:
      - platform: time_pattern
        minutes: "/5"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - input_text.energy_hidden_devices
          - input_number.peco_delivery_rate
          - input_number.peco_supply_rate
          - input_number.peco_transmission_rate
          - input_number.peco_customer_charge
    sensor:
      - name: "Total Energy Today"
        unique_id: total_energy_today
        unit_of_measurement: "kWh"
        device_class: energy
        state: >
          {% set raw = states('input_text.energy_hidden_devices') %}
          {% set hidden = (raw if raw not in [none,'unknown','unavailable'] else '').split(',') | reject('eq','') | list %}
          {% set ns = namespace(total=0) %}
          {% for s in states.sensor
              if s.entity_id.endswith('_today_s_consumption')
              and 'total_' not in s.entity_id
              and s.state not in ['unavailable','unknown'] %}
            {% set slug = s.entity_id | replace('sensor.','') | replace('_today_s_consumption','') %}
            {% if slug not in hidden %}
              {% set ns.total = ns.total + (s.state | float(0)) %}
            {% endif %}
          {% endfor %}
          {{ ns.total | round(2) }}

      - name: "Total Energy This Month"
        unique_id: total_energy_this_month
        unit_of_measurement: "kWh"
        device_class: energy
        state: >
          {% set raw = states('input_text.energy_hidden_devices') %}
          {% set hidden = (raw if raw not in [none,'unknown','unavailable'] else '').split(',') | reject('eq','') | list %}
          {% set ns = namespace(total=0) %}
          {% for s in states.sensor
              if s.entity_id.endswith('_this_month_s_consumption')
              and 'total_' not in s.entity_id
              and s.state not in ['unavailable','unknown'] %}
            {% set slug = s.entity_id | replace('sensor.','') | replace('_this_month_s_consumption','') %}
            {% if slug not in hidden %}
              {% set ns.total = ns.total + (s.state | float(0)) %}
            {% endif %}
          {% endfor %}
          {{ ns.total | round(2) }}

      - name: "Total Energy Cost Today"
        unique_id: total_energy_cost_today
        unit_of_measurement: "$"
        state: >
          {% set rate = states('sensor.peco_variable_rate') | float(0) %}
          {% set raw = states('input_text.energy_hidden_devices') %}
          {% set hidden = (raw if raw not in [none,'unknown','unavailable'] else '').split(',') | reject('eq','') | list %}
          {% set ns = namespace(total=0) %}
          {% for s in states.sensor
              if s.entity_id.endswith('_today_s_consumption')
              and 'total_' not in s.entity_id
              and s.state not in ['unavailable','unknown'] %}
            {% set slug = s.entity_id | replace('sensor.','') | replace('_today_s_consumption','') %}
            {% if slug not in hidden %}
              {% set ns.total = ns.total + (s.state | float(0)) %}
            {% endif %}
          {% endfor %}
          {{ (ns.total * rate) | round(2) }}

      - name: "Total Energy Cost Monthly"
        unique_id: total_energy_cost_monthly
        unit_of_measurement: "$"
        state: >
          {% set rate = states('sensor.peco_variable_rate') | float(0) %}
          {% set cust = states('input_number.peco_customer_charge') | float(0) %}
          {% set raw = states('input_text.energy_hidden_devices') %}
          {% set hidden = (raw if raw not in [none,'unknown','unavailable'] else '').split(',') | reject('eq','') | list %}
          {% set ns = namespace(total=0) %}
          {% for s in states.sensor
              if s.entity_id.endswith('_this_month_s_consumption')
              and 'total_' not in s.entity_id
              and s.state not in ['unavailable','unknown'] %}
            {% set slug = s.entity_id | replace('sensor.','') | replace('_this_month_s_consumption','') %}
            {% if slug not in hidden %}
              {% set ns.total = ns.total + (s.state | float(0)) %}
            {% endif %}
          {% endfor %}
          {{ (ns.total * rate + cust) | round(2) }}

      - name: "Daily Average Energy This Month"
        unique_id: daily_average_energy_this_month
        unit_of_measurement: "kWh"
        device_class: energy
        state: >
          {% set day = now().day %}
          {% set raw = states('input_text.energy_hidden_devices') %}
          {% set hidden = (raw if raw not in [none,'unknown','unavailable'] else '').split(',') | reject('eq','') | list %}
          {% set ns = namespace(total=0) %}
          {% for s in states.sensor
              if s.entity_id.endswith('_this_month_s_consumption')
              and 'total_' not in s.entity_id
              and s.state not in ['unavailable','unknown'] %}
            {% set slug = s.entity_id | replace('sensor.','') | replace('_this_month_s_consumption','') %}
            {% if slug not in hidden %}
              {% set ns.total = ns.total + (s.state | float(0)) %}
            {% endif %}
          {% endfor %}
          {{ (ns.total / day) | round(2) if day > 0 else 0 }}

      - name: "Daily Average Energy Cost This Month"
        unique_id: daily_average_energy_cost_this_month
        unit_of_measurement: "$"
        state: >
          {% set rate = states('sensor.peco_variable_rate') | float(0) %}
          {% set day = now().day %}
          {% set raw = states('input_text.energy_hidden_devices') %}
          {% set hidden = (raw if raw not in [none,'unknown','unavailable'] else '').split(',') | reject('eq','') | list %}
          {% set ns = namespace(total=0) %}
          {% for s in states.sensor
              if s.entity_id.endswith('_this_month_s_consumption')
              and 'total_' not in s.entity_id
              and s.state not in ['unavailable','unknown'] %}
            {% set slug = s.entity_id | replace('sensor.','') | replace('_this_month_s_consumption','') %}
            {% if slug not in hidden %}
              {% set ns.total = ns.total + (s.state | float(0)) %}
            {% endif %}
          {% endfor %}
          {{ ((ns.total / day) * rate) | round(2) if day > 0 else 0 }}

      - name: "Projected Monthly Energy Cost"
        unique_id: projected_monthly_energy_cost
        unit_of_measurement: "$"
        state: >
          {% set rate = states('sensor.peco_variable_rate') | float(0) %}
          {% set cust = states('input_number.peco_customer_charge') | float(0) %}
          {% set day = now().day %}
          {% set days_in_month = (now().replace(month=now().month % 12 + 1, day=1) - timedelta(days=1)).day if now().month < 12 else 31 %}
          {% set raw = states('input_text.energy_hidden_devices') %}
          {% set hidden = (raw if raw not in [none,'unknown','unavailable'] else '').split(',') | reject('eq','') | list %}
          {% set ns = namespace(total=0) %}
          {% for s in states.sensor
              if s.entity_id.endswith('_this_month_s_consumption')
              and 'total_' not in s.entity_id
              and s.state not in ['unavailable','unknown'] %}
            {% set slug = s.entity_id | replace('sensor.','') | replace('_this_month_s_consumption','') %}
            {% if slug not in hidden %}
              {% set ns.total = ns.total + (s.state | float(0)) %}
            {% endif %}
          {% endfor %}
          {% if day > 0 and ns.total > 0 %}
            {{ ((ns.total / day) * days_in_month * rate + cust) | round(2) }}
          {% else %}
            {{ cust | round(2) }}
          {% endif %}

      - name: "Estimated Annual Energy Cost"
        unique_id: estimated_annual_energy_cost
        unit_of_measurement: "$"
        state: >
          {% set rate = states('sensor.peco_variable_rate') | float(0) %}
          {% set cust = states('input_number.peco_customer_charge') | float(0) %}
          {% set day = now().day %}
          {% set raw = states('input_text.energy_hidden_devices') %}
          {% set hidden = (raw if raw not in [none,'unknown','unavailable'] else '').split(',') | reject('eq','') | list %}
          {% set ns = namespace(total=0) %}
          {% for s in states.sensor
              if s.entity_id.endswith('_this_month_s_consumption')
              and 'total_' not in s.entity_id
              and s.state not in ['unavailable','unknown'] %}
            {% set slug = s.entity_id | replace('sensor.','') | replace('_this_month_s_consumption','') %}
            {% if slug not in hidden %}
              {% set ns.total = ns.total + (s.state | float(0)) %}
            {% endif %}
          {% endfor %}
          {% set daily_avg = (ns.total / day) if day > 0 else 0 %}
          {{ (daily_avg * 365 * rate + cust * 12) | round(2) }}

  # ---- Bill accuracy: ground-truth reference from the last real PECO bill ----
  # The tracked-device sensors above only sum whatever is plugged into a smart
  # plug (space heaters, a toaster, a dryer, a desk...). None of that is the
  # AC, water heater, fridge, or general house circuits, so "Projected Bill" /
  # "Est. Annual" above are always a floor, never the real number. These
  # sensors compare tracked usage against the real last bill so the dashboard
  # says so instead of silently under-reporting.
  - sensor:
      - name: "PECO Last Bill Daily kWh"
        unique_id: peco_last_bill_daily_kwh
        unit_of_measurement: "kWh"
        state: >
          {% set kwh = states('input_number.peco_last_bill_kwh') | float(0) %}
          {% set days = states('input_number.peco_last_bill_days') | float(1) %}
          {{ (kwh / days) | round(2) if days > 0 else 0 }}

      - name: "PECO Last Bill Daily Cost"
        unique_id: peco_last_bill_daily_cost
        unit_of_measurement: "$"
        state: >
          {% set amt = states('input_number.peco_last_bill_amount') | float(0) %}
          {% set days = states('input_number.peco_last_bill_days') | float(1) %}
          {{ (amt / days) | round(2) if days > 0 else 0 }}

      - name: "PECO Tracked Coverage"
        unique_id: peco_tracked_coverage_pct
        unit_of_measurement: "%"
        icon: mdi:magnify-scan
        state: >
          {% set tracked_daily = states('sensor.daily_average_energy_this_month') | float(0) %}
          {% set bill_daily = states('sensor.peco_last_bill_daily_kwh') | float(0) %}
          {{ ((tracked_daily / bill_daily) * 100) | round(1) if bill_daily > 0 else 0 }}

  - binary_sensor:
      - name: "PECO Account Past Due"
        unique_id: peco_account_past_due
        device_class: problem
        state: "{{ states('input_number.peco_previous_balance') | float(0) > 0 }}"

